# 100% Self-Hosted OpenBot Stack (WebUI /app + Control Plane API + Signal + Marketplace + Headless Host)
#
# Quick Start on your Server / VPS:
#   1. Set OPENBOT_PUBLIC_HOST to your server's LAN IP, Tailscale IP, or public HTTPS domain (e.g. Cloudflare Tunnel):
#        export OPENBOT_PUBLIC_HOST=ob.example.com   # or 192.168.18.8 for LAN
#   2. (Optional) For cross-network connections behind strict Symmetric CGNAT, set free Cloudflare Calls TURN credentials:
#        export CLOUDFLARE_TURN_KEY_ID=<your-turn-key-id>
#        export CLOUDFLARE_TURN_API_TOKEN=<your-turn-api-token>
#   3. Build and start in background:
#        docker compose up -d --build
#   4. Open WebUI in browser:
#        https://ob.example.com/app  (or http://<LAN_IP>:3100/app on LAN)
#   5. Sign in the built-in Headless Server Host or generate Mobile Connect QR via CLI:
#        docker compose exec openbot openbot login
#        docker compose exec openbot openbot mobile-connect
#        docker compose exec openbot openbot status
#   6. (Optional) Sync with latest official OpenBot upstream at any time:
#        docker compose exec openbot selfhost sync && docker compose restart openbot

name: openbot

services:
  openbot:
    image: ghcr.io/krunstudio/openbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbot-selfhost
    restart: unless-stopped
    # Required for Chromium/Electron user namespaces inside Docker
    security_opt:
      - seccomp=./docker/seccomp.json
    # Chromium shared memory
    shm_size: 1g
    stop_grace_period: 60s
    ports:
      - "${OPENBOT_API_PORT:-3100}:3100"
      - "${REMOTE_SIGNAL_PORT:-3101}:3101"
    environment:
      # "app" = Full Stack (WebUI + Control Plane + Signal + Headless OpenBot Host)
      # "web" = Control Plane + WebUI + Signal only (without Headless Electron Host)
      OPENBOT_MODE: ${OPENBOT_MODE:-app}
      # Set this to your Server's LAN IP, Tailscale IP, or Public Domain (e.g. Cloudflare Tunnel hostname)
      # so WebUI (/app), Mobile Connect QR codes, and Signal WebSocket (/v1/signal) use the reachable address:
      OPENBOT_PUBLIC_HOST: ${OPENBOT_PUBLIC_HOST:-}
      OPENBOT_API_HOST: 0.0.0.0
      OPENBOT_API_PORT: 3100
      REMOTE_SIGNAL_PORT: 3101
      # Optional: Cloudflare Calls TURN relay credentials or custom JSON array of RTCIceServer objects
      # for cross-network WebRTC connections across strict Symmetric NAT / CGNAT:
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      REMOTE_ICE_SERVERS: ${REMOTE_ICE_SERVERS:-}
      # Set to "true" to automatically pull & rebase updates from official repo on container start
      OPENBOT_AUTO_SYNC: ${OPENBOT_AUTO_SYNC:-false}
      # Optional: Add AI Provider API keys for headless agents
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Optional SMTP settings (leave empty to display OTP login code directly on screen)
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - openbot-data:/data

volumes:
  openbot-data:
